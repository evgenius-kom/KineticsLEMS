# KineticsLEMS — algorithm parameters.
# Case description (material, method, file→rate map) lives in settings.json
# inside the case folder/zip. This file controls the analysis itself.

[conversion]
# α grid used by isoconversional methods. step is exclusive of 0 and 1.
step = 0.05
min  = 0.05
max  = 0.95

[methods]
# Which methods to run. Order matters: "preexponential" depends on
# "vyazovkin" + "master_plot"; "lifetime" depends on "preexponential";
# "uncertainty" depends on its target method already being enabled.
enabled = [
    "friedman", "kas", "ofw", "kissinger",
    "vyazovkin", "vyazovkin_aic",
    "master_plot", "preexponential", "multistep",
    "reaction_order", "coats_redfern", "uncertainty", "lifetime",
]

[methods.preexponential]
# f(α) model name (e.g. "F1", "F2", "A2", "R3"). Leave blank to auto-pick
# the top-ranked model from master_plot. Falls back to "F1" if master_plot
# is disabled.
model = ""

[methods.multistep]
# Detect multi-step kinetics by segmenting E(α) where it shifts by more
# than ``jump_threshold`` (relative). Min segment size in α-grid points.
jump_threshold   = 0.10
min_segment_size = 3

[methods.reaction_order]
# Sweep n in f(α) = (1−α)ⁿ on a linear grid; pick the value that gives
# the highest pooled R² of the linearization.
alpha_min = 0.1
alpha_max = 0.9
n_min     = 0.1
n_max     = 4.0
n_steps   = 80

[methods.coats_redfern]
# Per-rate model-fit baseline (E_a, A per model from ln(g(α)/T²) vs 1/T).
alpha_min = 0.1
alpha_max = 0.9
# Leave models empty to evaluate all 12; or restrict, e.g.
# models = ["F1", "A2", "R3"].

[methods.uncertainty]
# Which isoconversional method to jackknife-by-run for E(α) confidence
# intervals. Needs ≥ 3 heating rates to produce a non-NaN SE.
method = "vyazovkin"

[methods.lifetime]
# Predictive isothermal α(t) at several storage / operating temperatures.
# Uses the kinetic triplet (E_a(α) from Vyazovkin, A from preexponential,
# f(α) auto-picked from master_plot unless overridden below).
temperatures_C = [25.0, 40.0, 60.0]
alpha_targets  = [0.05, 0.10, 0.50, 0.90]
model          = ""              # blank → use master_plot best

[methods.vyazovkin]
# Activation-energy search bracket (kJ/mol) for the 1D minimization of Φ(E).
ea_bracket_kJ = [1.0, 600.0]

[methods.vyazovkin_aic]
# Half-width of the α-window used for numerical integration of J(E).
# Must satisfy 0 < delta_alpha < min(α_min, 1 − α_max).
delta_alpha   = 0.02
ea_bracket_kJ = [1.0, 600.0]

[output]
# Where results are written when running the CLI. Created if missing.
directory         = "out"
save_plots        = true
save_csv          = true
plot_dpi          = 300                  # paper-grade by default
plot_formats      = ["png", "pdf"]       # add "svg" for inline LaTeX/Web figures
per_method_panels = false                # extra one-figure-per-method outputs
