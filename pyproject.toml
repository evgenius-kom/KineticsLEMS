[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetics-lems"
version = "0.1.0"
description = "Isoconversional kinetic analysis (Friedman, KAS, OFW, Kissinger, Vyazovkin) for thermal-analysis data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "KineticsLEMS contributors" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kinetics-lems = "kinetics_lems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]  # We don't use ambiguous names; this is a fallback.

[tool.ruff.lint.per-file-ignores]
# Extraction utility holds embedded markdown README templates whose
# table-row lines are intentionally long; not worth refactoring.
"scripts/extract_reference_fixtures.py" = ["E501"]
